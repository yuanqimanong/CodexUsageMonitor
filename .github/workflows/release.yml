name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build, assemble, and validate release assets
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = .\scripts\Build-ReleaseArtifacts.ps1 `
              -OutputDirectory $env:RUNNER_TEMP
          $artifactRoot = $release.OutputDirectory

          "artifact_root=$artifactRoot" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "raw_exe=$(Join-Path $artifactRoot 'CodexUsageMonitor.exe')" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha_file=$(Join-Path $artifactRoot 'SHA256SUMS.txt')" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "standalone_zip=$(Join-Path $artifactRoot 'CodexUsageMonitor-windows-x64.zip')" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "plugin_zip=$(Join-Path $artifactRoot 'codex-usage-monitor-plugin.zip')" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageMonitor-release-assets
          path: |
            ${{ steps.package.outputs.raw_exe }}
            ${{ steps.package.outputs.sha_file }}
            ${{ steps.package.outputs.standalone_zip }}
            ${{ steps.package.outputs.plugin_zip }}
          if-no-files-found: error

      - name: Upload draft release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = "docs/releases/${{ github.ref_name }}.md"
          $notesArguments = @('--generate-notes')
          if (Test-Path -LiteralPath $notesPath) {
            $notesArguments = @('--notes-file', $notesPath)
          }
          gh release create "${{ github.ref_name }}" `
            "${{ steps.package.outputs.raw_exe }}" `
            "${{ steps.package.outputs.sha_file }}" `
            "${{ steps.package.outputs.standalone_zip }}" `
            "${{ steps.package.outputs.plugin_zip }}" `
            --repo "${{ github.repository }}" `
            --title "Codex Usage Monitor ${{ github.ref_name }}" `
            --verify-tag `
            --draft `
            @notesArguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }

      - name: Verify downloads and publish release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'release-download-check'
          gh release download "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Release download verification failed.' }
          $expectedFiles = @('CodexUsageMonitor.exe', 'CodexUsageMonitor-windows-x64.zip', 'codex-usage-monitor-plugin.zip')
          $verifiedFiles = @()
          foreach ($line in Get-Content -LiteralPath (Join-Path $downloadDirectory 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') { throw 'Invalid checksum entry.' }
            $expectedHash = $Matches[1]
            $fileName = $Matches[2]
            if ($expectedFiles -notcontains $fileName -or $verifiedFiles -contains $fileName) {
              throw "Unexpected or duplicate asset: $fileName"
            }
            $actualHash = (Get-FileHash -LiteralPath (Join-Path $downloadDirectory $fileName) -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) { throw "SHA-256 mismatch: $fileName" }
            $verifiedFiles += $fileName
          }
          if ($verifiedFiles.Count -ne $expectedFiles.Count) { throw 'Checksum manifest is incomplete.' }
          if (@(Get-ChildItem -LiteralPath $downloadDirectory -File).Count -ne 4) { throw 'Unexpected release asset count.' }
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
